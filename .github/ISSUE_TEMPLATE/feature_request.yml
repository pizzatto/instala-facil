name: Sugerir melhoria
description: Compartilhe uma ideia para o projeto
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual necessidade você quer resolver?
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Como a melhoria poderia funcionar?
    validations:
      required: true
